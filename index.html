<noscript>Musik-Bobins braucht JavaScript.</noscript>

<!-- Robin's Bobins (optional). Same site on GitHub Pages → family PIN, child, Robin, coins, streaks.
     When these files are missing (running on its own), the app works without them.
     Guest link (?gast=<Name>, for a classmate): no family page, no family PIN; Robin's picture and the
     guest start page (robins-bobins/shared/guest.js: coins, streak, parent PIN, "‹ Start") are used.
     The guest is remembered on that device; an explicit ?child=… (from Robin's Bobins) always wins. -->
<script>
(function () {
  var q = location.search, m = /[?&]gast=([^&#]*)/.exec(q), g = '';
  try {
    g = m ? decodeURIComponent(m[1]).trim() : '';
    if (g) localStorage.setItem('rb-gast', JSON.stringify(g));
    else if (!/[?&]child=/.test(q)) g = JSON.parse(localStorage.getItem('rb-gast') || 'null') || '';
  } catch (e) { /* storage blocked: guest only for this visit */ }
  window.MB_GUEST = g || null;
  if (g) { window.RB = {}; document.write('<script src="../robins-bobins/shared/robin.js"><\/script><script src="../robins-bobins/shared/guest.js"><\/script>'); }
  else document.write('<script src="../robins-bobins/shared/rb.js"><\/script><script src="../robins-bobins/shared/robin.js"><\/script>');
})();
</script>
